[workspace]
members = [
    "crates/ferryx-ir",
    "crates/ferryx-rewrite",
    "crates/ferryx-runtime",
    "crates/ferryx-target",
    "crates/ferryx-macros",
    "crates/ferryx-parser",
    "crates/ferryx-python",
    "crates/ferryx-plugin",
    "crates/ferryx-typescript",
    "crates/ferryx-wasm",
    "crates/ferryx-openapi",
    "crates/ferryx-grpc",
    "crates/ferryx-build",
    "crates/ferryx-cli",
    "crates/ferryx-bench",
    "crates/ferryx-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rithulkamesh/ferryx"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inventory = "0.3"
once_cell = "1"
proc-macro2 = "1"
pyo3 = { version = "0.28", features = ["extension-module"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
thiserror = "1"
owo-colors = "4"
toml = "0.8"
