name: Bug Report
description: Report correctness, compatibility, or runtime issues.
title: "[bug] "
labels: ["kind:bug", "needs:triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed and where?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal Rust source and command sequence.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Rust toolchain, Python version, OS/arch.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

