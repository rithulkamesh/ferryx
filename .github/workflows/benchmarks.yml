name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/ferryx-parser/**"
      - "core/ferryx-runtime/**"
      - "emitters/ferryx-python/**"
      - "tooling/ferryx-build/**"
      - "tooling/ferryx-bench/**"
      - "benchmarks/**"
      - "verification/**"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmark harness
        run: cargo run --manifest-path tooling/ferryx-bench/Cargo.toml -- --suite all --output verification/benchmarks/latest.json
      - name: Regression check
        run: python3 evaluation/scripts/check_regression.py evaluation/results/baseline.json verification/benchmarks/latest.json 1.20
      - name: Generate markdown report
        run: python3 evaluation/scripts/generate_report.py verification/benchmarks/latest.json verification/benchmarks/latest.md
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            verification/benchmarks/latest.json
            verification/benchmarks/latest.md

