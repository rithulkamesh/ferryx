name: Artifacts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate all committed artifacts
        run: bash scripts/generate_all_artifacts.sh
      - name: Verify artifact drift
        run: bash scripts/verify_all_artifacts.sh
      - name: Verify prompt + bundle snapshots
        run: |
          python3 scripts/run_prompt_verification.py
          python3 scripts/render_prompt_report.py
          python3 scripts/bundle_artifacts.py

