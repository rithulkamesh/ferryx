name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate doc files
        run: |
          test -f README.md
          test -f docs/README.md
          test -f architecture/overview.md
          test -f internals/ir.md
          test -f tutorials/getting-started.md
      - name: Link check
        run: python3 scripts/check_links.py

