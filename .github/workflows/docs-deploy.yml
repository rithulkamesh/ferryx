name: Docs Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bundle-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle markdown docs
        run: |
          mkdir -p site
          cp README.md site/index.md
          cp -R docs site/docs
          cp -R architecture site/architecture
          cp -R internals site/internals
          cp -R tutorials site/tutorials
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

